    stream_names:
      - Accelerometer
      - Gyroscope
      - Magnetometer
      - PPG
      - EDA
      - Temperature
    topic_names:
      - /emotibit/acc
      - /emotibit/gyro
      - /emotibit/mag
      - /emotibit/ppg
      - /emotibit/eda
      - /emotibit/temp
    emotibit_timer: 5.0